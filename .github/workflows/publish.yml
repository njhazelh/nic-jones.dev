# Scheduled publishing. A post dated in the future stays out of the site until
# a build on or after its date (src/lib/content.ts). App Platform doesn't
# rebuild on a timer, so this asks it to once a day when something is due.
#
# It rebuilds when:
#   - a non-draft entry in src/content is due but missing from the live
#     sitemap (scripts/due.mjs, which reads dates the same way the build
#     does), so a late or skipped run is caught up by the next one, or
#   - it's the 1st of the month, so computed durations ("nearly nine years")
#     and reviewBy warnings move on, or
#   - someone runs it by hand (Actions -> publish -> Run workflow).
#
# Needs one repository secret, DIGITALOCEAN_TOKEN: a DigitalOcean API token
# with the app:create_deployment and app:read scopes (or full write). Without
# it the job logs a notice and does nothing.
name: publish

on:
  schedule:
    # 06:00 UTC: a post dated 14 March appears around 06:00 UTC that day. One
    # with a time appears at the first run after that time.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      APP_ID: 314c856f-78d5-4cab-8477-14abe1547078 # nick-jones-me on App Platform
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Anything due that isn't live yet?
        id: due
        run: |
          due=$(node scripts/due.mjs --live https://nick-jones.me)
          if [ -n "$due" ]; then
            echo "Due:"; echo "$due"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Monthly or manual rebuild."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "Everything due is already live."
          fi

      - name: Ask App Platform for a fresh build
        if: steps.due.outputs.rebuild == 'true'
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ]; then
            echo "::notice::DIGITALOCEAN_TOKEN is not set, so nothing was deployed. See the comment at the top of publish.yml."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"force_build": true}' \
            "https://api.digitalocean.com/v2/apps/$APP_ID/deployments" | jq -r '.deployment.id // .'
